[package]
name = "buildshare"
version = "0.1.0"
description = "BuildShare: verified contributions into programmable project ownership"
license = "Apache-2.0"
repository = "https://github.com/MIKI4222/buildshare"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "buildshare"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
